name: build-ios
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Firebase config
        env:
          GSI: ${{ secrets.GOOGLE_SERVICE_INFO }}
        run: |
          if printf '%s' "$GSI" | grep -q "<?xml"; then
            printf '%s\n' "$GSI" > NutriLife/GoogleService-Info.plist
          else
            printf '%s' "$GSI" | tr -d '\r\n ' | base64 --decode > NutriLife/GoogleService-Info.plist
          fi
          test -s NutriLife/GoogleService-Info.plist && echo "plist OK"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project NutriLife.xcodeproj -scheme NutriLife \
            -sdk iphonesimulator -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          echo "=== ERREURS SWIFT ==="
          grep -E "\.swift:[0-9]+:[0-9]+: error:" build.log | sort -u | cut -c1-400 | head -40
          echo "=== AUTRES ERREURS ==="
          grep -E "^(error:|ld: |fatal error|\*\* BUILD FAILED)" build.log | sort -u | cut -c1-400 | head -20
          echo "=== FIN DU LOG ==="
          tail -n 40 build.log | cut -c1-300
      - name: Show resolved versions
        if: always()
        run: grep -A15 "Resolved source packages" build.log | cut -c1-200 | head -25
      - name: Zip app
        run: cd build/Build/Products/Debug-iphonesimulator && zip -r "$GITHUB_WORKSPACE/NutriLife-simulator.zip" NutriLife.app
      - uses: actions/upload-artifact@v4
        with:
          name: NutriLife-simulator
          path: NutriLife-simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log